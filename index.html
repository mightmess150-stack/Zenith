<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH :: SPEECH & AI INTERFACE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05050d;
            color: #00f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 10px;
        }

        canvas {
            background-color: #05050d;
            border-radius: 50%;
            margin: 10px 0;
        }

        .status-box {
            font-size: 1rem;
            color: #ffaa00;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-container {
            display: flex;
            width: 100%;
            max-width: 650px;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            background-color: #0d0d1a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            background-color: transparent;
            color: #00f0ff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #00f0ff;
            color: #05050d;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="title">ZENITH INTELLIGENCE</div>
    <canvas id="faceCanvas" width="400" height="400"></canvas>
    <div id="status" class="status-box">✅ ZENITH جاهز ومتصل! اكتب سؤالك للبدء.</div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">إرسال / Send</button>
    </div>

    <script>
        // إعدادات الحالة العامة
        let state = "idle"; // idle | thinking | speaking
        let blinkState = false;
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');
        const statusLbl = document.getElementById('status');
        const userInput = document.getElementById('userInput');

        // حلقة الرمش المستمرة
        setInterval(() => {
            blinkState = true;
            setTimeout(() => { blinkState = false; }, 120);
        }, 3800);

        // تحريك الوجه
        function animateFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 200, cy = 200;

            let color = "#00f0ff";
            if (state === "speaking") color = "#00ffaa";
            if (state === "thinking") color = "#ff2a6d";

            // رسم محيط الوجه
            ctx.beginPath();
            ctx.ellipse(cx, cy - 10, 100, 130, 0, 0, 2 * Math.PI);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            const eyeY = cy - 25;
            const lEyeX = cx - 40, rEyeX = cx + 40;

            // رسم العيون (الرمش أو الفتح)
            ctx.fillStyle = color;
            if (blinkState) {
                ctx.beginPath();
                ctx.moveTo(lEyeX - 15, eyeY); ctx.lineTo(lEyeX + 15, eyeY);
                ctx.moveTo(rEyeX - 15, eyeY); ctx.lineTo(rEyeX + 15, eyeY);
                ctx.stroke();
            } else {
                // العين اليمنى واليسرى
                ctx.beginPath();
                ctx.ellipse(lEyeX, eyeY, 18, 9, 0, 0, 2 * Math.PI);
                ctx.ellipse(rEyeX, eyeY, 18, 9, 0, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(lEyeX, eyeY, 6, 0, 2 * Math.PI);
                ctx.arc(rEyeX, eyeY, 6, 0, 2 * Math.PI);
                ctx.fill();
            }

            // رسم الحواجب
            ctx.beginPath();
            ctx.moveTo(lEyeX - 20, eyeY - 20); ctx.lineTo(lEyeX + 15, eyeY - 24);
            ctx.moveTo(rEyeX - 15, eyeY - 24); ctx.lineTo(rEyeX + 20, eyeY - 20);
            ctx.stroke();

            // رسم الأنف
            ctx.beginPath();
            ctx.moveTo(cx, eyeY + 10);
            ctx.lineTo(cx - 8, cy + 25);
            ctx.lineTo(cx + 5, cy + 25);
            ctx.stroke();

            // رسم الفم
            const mouthY = cy + 60;
            if (state === "speaking") {
                const amplitude = Math.abs(Math.sin(Date.now() / 100)) * 22 + 4;
                ctx.beginPath();
                ctx.ellipse(cx, mouthY, 28, amplitude / 2, 0, 0, 2 * Math.PI);
                ctx.fillStyle = "#101020";
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 28, mouthY);
                ctx.lineTo(cx + 28, mouthY);
                ctx.stroke();
            }

            requestAnimationFrame(animateFace);
        }

        // بدء التحريك
        animateFace();

        // إرسال وتوليد الرد
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = "";
            statusLbl.innerText = `أنت: ${text}`;
            statusLbl.style.color = "#ffffff";
            state = "thinking";

            // فحص هل اللغة عربية
            const isArabic = /[\u0600-\u06FF]/.test(text);

            // توليد الرد الذكي (يمكنك ربطه هنا بـ API الخاص بك)
            setTimeout(() => {
                let responseText = isArabic 
                    ? "مرحباً بك! أنا ZENITH، مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟"
                    : "Hello! I am ZENITH, your AI assistant. How can I help you today?";

                statusLbl.innerText = `ZENITH: ${responseText}`;
                statusLbl.style.color = "#00ffaa";

                // تحويل النص إلى صوت
                speakText(responseText, isArabic);
            }, 1000);
        }

        // تحويل النص إلى صوت بالمتصفح
        function speakText(text, isArabic) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = isArabic ? 'ar-SA' : 'en-US';
                
                utterance.onstart = () => { state = "speaking"; };
                utterance.onend = () => { state = "idle"; };
                utterance.onerror = () => { state = "idle"; };

                window.speechSynthesis.speak(utterance);
            } else {
                state = "idle";
            }
        }
    </script>
</body>
</html>
