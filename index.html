<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH :: AI INTERFACE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #120e16 0%, #05050d 100%);
            color: #00f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .title {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00f0ff, #7b2cbf, #c9184a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(123, 44, 191, 0.4);
        }

        .canvas-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 0 30px rgba(123, 44, 191, 0.2);
            margin: 15px 0;
        }

        canvas {
            display: block;
        }

        .status-box {
            font-size: 1.05rem;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 16px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-container {
            display: flex;
            width: 100%;
            max-width: 650px;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            background-color: rgba(13, 13, 26, 0.8);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        button {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #7b2cbf, #c9184a);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(201, 24, 74, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(123, 44, 191, 0.6);
        }

        button:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="title">ZENITH AI</div>
    
    <div class="canvas-container">
        <canvas id="faceCanvas" width="320" height="320"></canvas>
    </div>

    <div id="status" class="status-box">✅ أهلاً بك! أنا ZENITH، اكتب سؤالك وسأجيبك فوراً.</div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        let state = "idle"; // idle | thinking | speaking
        let blinkState = false;
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');
        const statusLbl = document.getElementById('status');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // التوكن والموجه الجديد للـ API
        const HUGGING_FACE_TOKEN = "HFAKeGnAi6OpYwynatgltRFbXwiiySo";
        const API_ENDPOINT = "https://router.huggingface.co/v1/chat/completions";

        // حلقة الرمش
        setInterval(() => {
            blinkState = true;
            setTimeout(() => { blinkState = false; }, 120);
        }, 4000);

        // رسم وجه ZENITH
        function animateFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 160, cy = 160;

            let color = "#00f0ff";
            let glowColor = "rgba(0, 240, 255, 0.5)";

            if (state === "speaking") {
                color = "#00ffaa";
                glowColor = "rgba(0, 255, 170, 0.6)";
            } else if (state === "thinking") {
                color = "#ff2a6d";
                glowColor = "rgba(255, 42, 109, 0.6)";
            }

            ctx.shadowBlur = 15;
            ctx.shadowColor = glowColor;

            // إطار الوجه
            ctx.beginPath();
            ctx.ellipse(cx, cy - 10, 80, 110, 0, 0, 2 * Math.PI);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            const eyeY = cy - 25;
            const lEyeX = cx - 32, rEyeX = cx + 32;

            // العيون
            ctx.fillStyle = color;
            if (blinkState) {
                ctx.beginPath();
                ctx.moveTo(lEyeX - 12, eyeY); ctx.lineTo(lEyeX + 12, eyeY);
                ctx.moveTo(rEyeX - 12, eyeY); ctx.lineTo(rEyeX + 12, eyeY);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.ellipse(lEyeX, eyeY, 14, 7, 0, 0, 2 * Math.PI);
                ctx.ellipse(rEyeX, eyeY, 14, 7, 0, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(lEyeX, eyeY, 5, 0, 2 * Math.PI);
                ctx.arc(rEyeX, eyeY, 5, 0, 2 * Math.PI);
                ctx.fill();
            }

            // الأنف
            ctx.beginPath();
            ctx.moveTo(cx, eyeY + 10);
            ctx.lineTo(cx - 5, cy + 18);
            ctx.lineTo(cx + 4, cy + 18);
            ctx.stroke();

            // الفم
            const mouthY = cy + 45;
            if (state === "speaking") {
                const amplitude = Math.abs(Math.sin(Date.now() / 80)) * 18 + 4;
                ctx.beginPath();
                ctx.ellipse(cx, mouthY, 20, amplitude / 2, 0, 0, 2 * Math.PI);
                ctx.fillStyle = "#120e16";
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 20, mouthY);
                ctx.lineTo(cx + 20, mouthY);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
            requestAnimationFrame(animateFace);
        }

        animateFace();

        // إرسال السؤال عبر الـ Router API المحدث
        async function sendMessage() {
            const text = userInput.value.trim();

            if (!text || state === "thinking") return;

            userInput.value = "";
            statusLbl.innerText = `أنت: ${text}`;
            statusLbl.style.color = "#ffffff";
            state = "thinking";
            sendBtn.disabled = true;

            const isArabic = /[\u0600-\u06FF]/.test(text);

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HUGGING_FACE_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "Qwen/Qwen2.5-7B-Instruct",
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي يدعى ZENITH. أجب باختصار ووضوح." },
                            { role: "user", content: text }
                        ],
                        max_tokens: 150
                    })
                });

                const data = await response.json();
                let aiResponse = "";

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    aiResponse = data.choices[0].message.content;
                } else if (data.error) {
                    aiResponse = "⚠️ خطأ في المفتاح أو الخدمة: " + (data.error.message || JSON.stringify(data.error));
                } else {
                    aiResponse = isArabic ? "أنا هنا لمساعدتك! كيف أستطيع خدمتك؟" : "I am here to help you! How can I assist you?";
                }

                statusLbl.innerText = `ZENITH: ${aiResponse}`;
                statusLbl.style.color = "#00ffaa";

                speakText(aiResponse, isArabic);

            } catch (error) {
                statusLbl.innerText = "❌ حدث خطأ في الاتصال بالسيرفر. تحقق من الاتصال بالإنترنت.";
                statusLbl.style.color = "#ff2a6d";
                state = "idle";
                sendBtn.disabled = false;
            }
        }

        // تحويل النص إلى صوت
        function speakText(text, isArabic) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = isArabic ? 'ar-SA' : 'en-US';
                
                utterance.onstart = () => { state = "speaking"; };
                utterance.onend = () => { 
                    state = "idle"; 
                    sendBtn.disabled = false;
                };
                utterance.onerror = () => { 
                    state = "idle"; 
                    sendBtn.disabled = false;
                };

                window.speechSynthesis.speak(utterance);
            } else {
                state = "idle";
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
